defaults:
  - hopper_default
  - _self_

task: 'hopper_flat'
experiment_name: 'hopper_single_int'

env_config:
  env:
    num_envs: 4096
    num_observations: 20
    num_actions: 4
    episode_length_s: 20
  rewards:
    scales:
      termination: -500.0
      ang_vel_xy: -0.01
      orientation: -80.0
      torques: -0.000001
      dof_vel: -0.
      dof_acc: -2.5e-8 # changed from ...-7
      unit_quat: -0.01 # changed from -.1
      collision: -1.
      action_rate: -0.01
    only_positive_rewards: False
    tracking_sigma: 0.25
    soft_dof_pos_limit: 1.
    soft_dof_vel_limit: 1.
    soft_torque_limit: 1.
    base_height_target: .55
    max_contact_force: 100.
  normalization:
    obs_scales:
      trajectory: [1, 1]

train_config:
  policy:
    actor_hidden_dims: [128, 64, 32]
    critic_hidden_dims: [128, 64, 32]
    activation: 'elu'
  algorithm:
    entropy_coef: 0.01
  runner:
    run_name: ''
    experiment_name: ${experiment_name}
    load_run: -1
    max_iterations: 1000